<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle Words — Word Puzzle Activity for Kids</title>
<meta name="description" content="Drop letter tiles into place, finish picture sentences, and find rhyming words. A puzzle-based word learning activity for kids aged 3+. Free, no ads.">
<meta name="keywords" content="word puzzle activity kids, rhyming activity, sentence activity for kids, letter tile activity, phonics puzzle">
<link rel="canonical" href="https://letterlab.cc/puzzle-words/">
<meta property="og:type"        content="website">
<meta property="og:url"         content="https://letterlab.cc/puzzle-words/">
<meta property="og:title"       content="Puzzle Words — Word Puzzle Activity for Kids">
<meta property="og:description" content="Drop tiles, finish sentences, and find rhymes. Word puzzle learning activity for kids aged 3+.">
<meta name="twitter:card"        content="summary">
<meta name="twitter:title"       content="Puzzle Words — Word Puzzle Activity for Kids">
<meta name="twitter:description" content="Letter tiles, picture sentences, and rhyme finding. Kids word puzzle activity.">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="../_shared/lab.css">
<link rel="stylesheet" href="game.css">
</head>
<body>

<div class="toast" id="toast"></div>

<!-- GATE -->
<div class="admin-overlay" id="gateOverlay">
  <div class="admin-modal gate-modal">
    <h2 class="gate-heading">// Grownup Check</h2>
    <p class="gate-question" id="gateQuestion" aria-live="polite">2 × 5 = ?</p>
    <div class="gate-choices" id="gateButtons" role="group" aria-label="Answer choices"></div>
    <p id="gateError" class="gate-error"></p>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-modal">
    <h2>// Grownup Mode</h2>
    <p class="admin-sub">Puzzle Words settings</p>

    <div class="admin-section">
      <h3>Activity</h3>
      <div class="mode-opts">
        <button class="mode-opt active" data-mode="tiledrop">Tile Drop</button>
        <button class="mode-opt" data-mode="sentence">Finish Sentence</button>
        <button class="mode-opt" data-mode="rhyme">Rhyme Time</button>
      </div>
    </div>

    <div class="admin-section">
      <h3>Stats</h3>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num" id="statSolved">0</div><div class="stat-lbl">Solved</div></div>
        <div class="stat-card"><div class="stat-num" id="statStreak">0</div><div class="stat-lbl">Streak</div></div>
      </div>
    </div>

    <div class="admin-section">
      <h3>Display</h3>
      <button class="abtn toggle-row" id="grownupToggleBtn">
        <span id="grownupDot" class="status-dot"></span>
        <span id="grownupLabel">Dark mode: OFF</span>
      </button>
    </div>

    <div class="overlay-close">
      <button class="abtn ghost" id="closeAdminBtn">Close</button>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="gameView" class="view active view-pad">
  <header>
    <div class="logo-wrap">
      <div class="logo">🧩 Puzzle<span>Words</span></div>
      <div class="logo-sub" id="modeSub">Tile Drop</div>
    </div>
    <div class="header-controls">
      <button class="btn-next" id="skipBtn">SKIP →</button>
      <a class="btn-icon home-link" href="../" title="Game Centre">🏠</a>
      <button class="gear-btn" id="adminBtn"><span class="dot"></span>⚙</button>
    </div>
  </header>

  <div class="game-area">
    <div class="star-bar">
      <span class="star" id="star0">⭐</span>
      <span class="star" id="star1">⭐</span>
      <span class="star" id="star2">⭐</span>
      <span class="star" id="star3">⭐</span>
      <span class="star" id="star4">⭐</span>
    </div>

    <div class="is-hidden big-emoji" id="bigEmoji"></div>
    <div class="mode-label" id="modeLabel">TILE DROP</div>
    <div class="is-hidden puzzle-slots"   id="puzzleSlots"  ></div>
    <div class="is-hidden rhyme-prompt"   id="rhymePrompt"  ></div>
    <div class="is-hidden sentence-display" id="sentenceDisplay"></div>
    <div class="result-msg"     id="resultMsg"></div>
    <div class="is-hidden tile-btns"      id="tileBtns"     ></div>
    <div class="is-hidden picture-options" id="pictureOptions"></div>
  </div>

  <footer>Made with 🩵 for L&amp;G</footer>
</div>

<script src="../_shared/lab.js"></script>
<script src="../_shared/words.js"></script>
<script src="game.js"></script>
</body>
</html>
