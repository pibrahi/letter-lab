<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superhero Spelling Academy — Kids Spelling Activity</title>
<meta name="description" content="Help your child become a spelling superhero! Fix broken words, unscramble the villain's mix-ups, and earn printable hero badges. Kids spelling activity.">
<meta name="keywords" content="kids spelling activity, spelling practice, phonics activity, word activity for kids, educational spelling">
<link rel="canonical" href="https://letterlab.cc/spelling-academy/">
<meta property="og:type"        content="website">
<meta property="og:url"         content="https://letterlab.cc/spelling-academy/">
<meta property="og:title"       content="Superhero Spelling Academy — Kids Spelling Activity">
<meta property="og:description" content="Fix broken words, unscramble villain mix-ups, and earn hero badges. Spelling activity for kids aged 4+.">
<meta name="twitter:card"        content="summary">
<meta name="twitter:title"       content="Superhero Spelling Academy">
<meta name="twitter:description" content="Fix broken words and earn superhero badges. Kids spelling activity.">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="../_shared/lab.css">
<link rel="stylesheet" href="game.css">
</head>
<body>

<div class="toast" id="toast"></div>

<!-- GATE -->
<div class="admin-overlay" id="gateOverlay">
  <div class="admin-modal gate-modal">
    <h2 class="gate-heading">// Grownup Check</h2>
    <p class="gate-question">2 × 5 = ?</p>
    <div class="gate-choices" id="gateButtons"></div>
    <p id="gateError" class="gate-error"></p>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-modal">
    <h2>// Grownup Mode</h2>
    <p class="admin-sub">Spelling Academy settings</p>

    <div class="admin-section">
      <h3>Activity</h3>
      <div class="mode-opts">
        <button class="mode-opt active" data-mode="fix">Fix the Word</button>
        <button class="mode-opt" data-mode="mixup">Villain Mix-Up</button>
      </div>
    </div>

    <div class="admin-section">
      <h3>Word Length</h3>
      <div class="len-opts">
        <button class="len-opt" data-len="3">3</button>
        <button class="len-opt" data-len="4">4</button>
        <button class="len-opt" data-len="5">5</button>
        <button class="len-opt active" data-len="0">All</button>
      </div>
    </div>

    <div class="admin-section">
      <h3>Stats</h3>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num" id="statWords">0</div><div class="stat-lbl">Words</div></div>
        <div class="stat-card"><div class="stat-num" id="statBadges">0</div><div class="stat-lbl">Badges</div></div>
      </div>
    </div>

    <div class="admin-section">
      <h3>Display</h3>
      <button class="abtn toggle-row" id="grownupToggleBtn">
        <span id="grownupDot" class="status-dot"></span>
        <span id="grownupLabel">Dark mode: OFF</span>
      </button>
    </div>

    <div class="overlay-close">
      <button class="abtn ghost" id="closeAdminBtn">Close</button>
    </div>
  </div>
</div>

<!-- BADGE -->
<div class="badge-overlay" id="badgeOverlay">
  <div class="badge-card">
    <div class="badge-shield">🦸</div>
    <div class="badge-title">SPELLING HERO!</div>
    <div class="badge-sub">Amazing work! You saved 5 words<br>from the villain!</div>
    <div class="badge-btn-row">
      <button class="btn-primary" id="printBadgeBtn">🖨 Print Badge</button>
      <button class="btn-primary keep-playing" id="keepPlayingBtn">Keep Playing</button>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="gameView" class="view active view-pad">
  <header>
    <div class="logo-wrap">
      <div class="logo">⚡ Spelling<span>Academy</span></div>
      <div class="logo-sub" id="modeSub">Fix the Broken Word</div>
    </div>
    <div class="header-controls">
      <button class="btn-next" id="skipBtn">SKIP →</button>
      <a class="btn-icon home-link" href="../" title="Learning Centre">🏠</a>
      <button class="gear-btn" id="adminBtn"><span class="dot"></span>⚙</button>
    </div>
  </header>

  <div class="game-area">
    <div class="star-bar">
      <span class="star" id="star0">⭐</span>
      <span class="star" id="star1">⭐</span>
      <span class="star" id="star2">⭐</span>
      <span class="star" id="star3">⭐</span>
      <span class="star" id="star4">⭐</span>
    </div>

    <div class="word-emoji" id="wordEmoji">🐱</div>
    <div class="mode-label" id="modeLabel">FIX THE WORD</div>
    <div class="word-slots" id="wordSlots"></div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="choices" id="choices"></div>
  </div>

  <footer>Made with 🩵 for L&amp;G</footer>
</div>

<script src="../_shared/lab.js"></script>
<script src="game.js"></script>
</body>
</html>
