<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Safari — Animal Word Activity for Kids</title>
<meta name="description" content="Match animals to their words, learn first letters, and spell animal names. An animal-themed word learning activity for kids aged 3+. Free, no ads.">
<meta name="keywords" content="animal word activity for kids, spelling animals, first letter activity, phonics for toddlers, kids reading activity">
<link rel="canonical" href="https://letterlab.cc/word-safari/">
<meta property="og:type"        content="website">
<meta property="og:url"         content="https://letterlab.cc/word-safari/">
<meta property="og:title"       content="Word Safari — Animal Word Activity for Kids">
<meta property="og:description" content="Match animals to words, learn first letters, and spell animal names. Word learning activity for kids aged 3+.">
<meta name="twitter:card"        content="summary">
<meta name="twitter:title"       content="Word Safari — Animal Word Activity for Kids">
<meta name="twitter:description" content="Match animals to words and spell them out. Kids word learning activity.">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="../_shared/lab.css">
<link rel="stylesheet" href="game.css">
</head>
<body>

<div class="toast" id="toast"></div>

<!-- GATE -->
<div class="admin-overlay" id="gateOverlay">
  <div class="admin-modal gate-modal">
    <h2 class="gate-heading">// Grownup Check</h2>
    <p class="gate-question" id="gateQuestion" aria-live="polite">2 × 5 = ?</p>
    <div class="gate-choices" id="gateButtons" role="group" aria-label="Answer choices"></div>
    <p id="gateError" class="gate-error"></p>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-modal">
    <h2>// Grownup Mode</h2>
    <p class="admin-sub">Word Safari settings</p>

    <div class="admin-section">
      <h3>Activity</h3>
      <div class="mode-opts">
        <button class="mode-opt active" data-mode="match">Match Animal</button>
        <button class="mode-opt" data-mode="firstletter">First Letter</button>
        <button class="mode-opt" data-mode="spell">Spell It Out</button>
      </div>
    </div>

    <div class="admin-section">
      <h3>Stats</h3>
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-num" id="statCorrect">0</div><div class="stat-lbl">Correct</div></div>
        <div class="stat-card"><div class="stat-num" id="statStreak">0</div><div class="stat-lbl">Streak</div></div>
      </div>
    </div>

    <div class="admin-section">
      <h3>Display</h3>
      <button class="abtn toggle-row" id="grownupToggleBtn">
        <span id="grownupDot" class="status-dot"></span>
        <span id="grownupLabel">Dark mode: OFF</span>
      </button>
    </div>

    <div class="overlay-close">
      <button class="abtn ghost" id="closeAdminBtn">Close</button>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="gameView" class="view active view-pad">
  <header>
    <div class="logo-wrap">
      <div class="logo">🦁 Word<span>Safari</span></div>
      <div class="logo-sub" id="modeSub">Match the Animal</div>
    </div>
    <div class="header-controls">
      <button class="btn-next" id="skipBtn">SKIP →</button>
      <a class="btn-icon home-link" href="../" title="Learning Centre">🏠</a>
      <button class="gear-btn" id="adminBtn"><span class="dot"></span>⚙</button>
    </div>
  </header>

  <div class="game-area">
    <div class="star-bar">
      <span class="star" id="star0">⭐</span>
      <span class="star" id="star1">⭐</span>
      <span class="star" id="star2">⭐</span>
      <span class="star" id="star3">⭐</span>
      <span class="star" id="star4">⭐</span>
    </div>

    <div class="animal-emoji" id="animalEmoji">🦁</div>
    <div class="mode-label" id="modeLabel">MATCH</div>
    <div class="question-prompt" id="questionPrompt"></div>
    <div class="is-hidden spell-slots" id="spellSlots"></div>
    <div class="result-msg" id="resultMsg"></div>
    <div class="is-hidden word-options"   id="wordOptions"  ></div>
    <div class="is-hidden letter-options" id="letterOptions"></div>
  </div>

  <footer>Made with 🩵 for L&amp;G</footer>
</div>

<script src="../_shared/lab.js"></script>
<script src="../_shared/words.js"></script>
<script src="game.js"></script>
</body>
</html>
